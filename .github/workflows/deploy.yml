name: Deploy Mayura Cafe to mayuracafe.gyanart.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mayura-cafe-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website files
        run: |
          test -f site/index.html || {
            echo "site/index.html not found"
            exit 1
          }
          test -f site/assets/css/style.css || {
            echo "site/assets/css/style.css not found"
            exit 1
          }
          test -f site/assets/js/main.js || {
            echo "site/assets/js/main.js not found"
            exit 1
          }
          test -f site/assets/img/favicon.svg || {
            echo "site/assets/img/favicon.svg not found"
            exit 1
          }

      - name: Deploy website files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: /mayuracafe/
          local-dir: ./site/
          exclude: |
            **/.github/**
            **/README.md
            **/.DS_Store
